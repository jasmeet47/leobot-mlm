name: LUMIFLOWON Release Verification

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  laravel-tests:
    name: PHP 8.3 - Laravel Tests
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5433"
      DB_DATABASE: leobot_financial_disposable
      DB_USERNAME: leobot_ci
      DB_PASSWORD: leobot_ci_disposable_only
      DB_URL: ""
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, pdo_pgsql, pgsql, gmp, bcmath, curl, xml, zip, intl, gd
          tools: composer:v2
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit PHP Dependencies
        run: |
          audit_status=0
          composer audit --locked --format=json > composer-audit.json || audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            python3 - <<'PYTHON'
          import json
          from pathlib import Path
          try:
              report = json.loads(Path('composer-audit.json').read_text())
              messages = []
              for package, advisories in (report.get('advisories') or {}).items():
                  rows = advisories.values() if isinstance(advisories, dict) else advisories
                  for advisory in rows:
                      messages.append(package + ' ' + advisory.get('advisoryId', '') + ': ' + advisory.get('title', '') + ' ' + advisory.get('link', ''))
              for package in (report.get('abandoned') or []):
                  messages.append('Abandoned dependency: ' + package)
              if not messages:
                  messages = [json.dumps(report, ensure_ascii=True)[:2000]]
          except (ValueError, OSError, AttributeError, TypeError):
              messages = ['Composer audit could not produce a valid advisory report.']
          for message in messages:
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error file=composer.lock,title=Composer security audit::' + escaped)
          PYTHON
          fi
          exit "$audit_status"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Build and Audit Frontend
        run: |
          npm ci --ignore-scripts
          npm audit
          npm run build

      - name: Generate Testing APP_KEY
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Start Isolated PostgreSQL
        run: |
          docker run -d \
            --name leobot-ci-postgres \
            -e POSTGRES_DB=leobot_financial_disposable \
            -e POSTGRES_USER=leobot_ci \
            -e POSTGRES_PASSWORD=leobot_ci_disposable_only \
            -p 127.0.0.1:5433:5433 \
            postgres:16 -c port=5433

          for i in $(seq 1 30); do
            if docker exec leobot-ci-postgres pg_isready \
              -U leobot_ci -d leobot_financial_disposable -p 5433; then
              exit 0
            fi
            sleep 2
          done
          docker logs leobot-ci-postgres
          exit 1

      - name: Verify Disposable Database
        run: |
          php -r '
            $pdo = new PDO(
              "pgsql:host=127.0.0.1;port=5433;dbname=leobot_financial_disposable",
              "leobot_ci",
              "leobot_ci_disposable_only"
            );
            $row = $pdo->query(
              "SELECT current_database() AS db, inet_server_port() AS port"
            )->fetch(PDO::FETCH_ASSOC);
            if ($row["db"] !== "leobot_financial_disposable" || (int)$row["port"] !== 5433) {
              throw new RuntimeException("SAFETY STOP: CI database identity mismatch");
            }
            echo "Disposable PostgreSQL identity verified\n";
          '

      - name: Prepare Disposable Database
        run: php artisan migrate --force

      - name: Check PHP Header Safety
        run: php artisan test --filter=PhpHeaderSafetyTest

      - name: Run Laravel Tests
        run: |
          test_status=0
          php artisan test --log-junit release-tests.xml || test_status=$?
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          def annotation(level, message):
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::' + level + ' title=PHP 8.3 release tests::' + escaped)
          if not Path('release-tests.xml').exists():
              annotation('error', 'Test runner did not produce the JUnit report.')
          else:
              cases = list(ET.parse('release-tests.xml').getroot().iter('testcase'))
              counts = {kind: sum(case.find(kind) is not None for case in cases) for kind in ['failure', 'error', 'skipped']}
              annotation('notice', 'Total=' + str(len(cases)) + '; assertions=' + str(sum(int(case.get('assertions', '0')) for case in cases)) + '; ' + str(counts))
              for case in cases:
                  for kind in ['failure', 'error']:
                      issue = case.find(kind)
                      if issue is not None:
                          annotation('error', case.get('class', case.get('classname', '')) + '::' + case.get('name', '') + '\n' + (issue.text or '')[:2500])
          PYTHON
          exit "$test_status"
